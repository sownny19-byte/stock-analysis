<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獵人戰術監控中心 | 首席分析師專屬系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        brand: {
                            gold: '#ffd700', accent: '#3b82f6', danger: '#10b981', 
                            success: '#ef4444', 
                            warning: '#f59e0b', ma5: '#E5C158', ma10: '#73C0DE', ma20: '#EE6666'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 custom-scrollbar relative">
    
    <!-- 確保 Toast 容器存在以防預覽失敗 -->
    <div id="toast" class="fixed bottom-5 right-5 z-[100] transition-all duration-500 translate-y-20 opacity-0"></div>

    <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-8 gap-5">
        <div>
            <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                <i data-lucide="crosshair" class="text-brand-accent h-8 w-8"></i>
                首席分析師 | 戰術監控中心 <span class="text-xs bg-brand-accent/20 text-brand-accent px-2 py-1 rounded-full ml-2">Cloud Sync</span>
            </h1>
            <div class="text-gray-400 mt-2 flex flex-wrap items-center gap-3">
                <p class="flex items-center gap-2">
                    <i data-lucide="clock" class="h-4 w-4"></i> 基準時間：<span id="currentTimeDisplay">讀取中...</span>
                </p>
                <button onclick="syncPricesWithAI()" id="syncBtn" class="flex items-center gap-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-brand-accent px-2.5 py-1 rounded-md transition-colors border border-gray-700 shadow-sm">
                    <i id="syncIcon" data-lucide="search" class="h-3.5 w-3.5"></i> Google 即時同步
                </button>
                <span id="cloudStatus" class="flex items-center gap-1 text-xs text-brand-warning bg-brand-warning/10 px-2 py-1 rounded-md">
                    <i data-lucide="cloud-off" class="h-3.5 w-3.5"></i> 狀態偵測中
                </span>
            </div>
        </div>
        <div class="flex flex-col lg:flex-row items-stretch lg:items-center gap-4 w-full xl:w-auto">
            <button onclick="generateDailyReport()" class="w-full lg:w-auto bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white px-5 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg hover:shadow-gray-700/50">
                <i data-lucide="sparkles" class="h-5 w-5 text-brand-gold"></i> AI 戰術報告
            </button>
            <button onclick="openAddModal()" class="w-full lg:w-auto bg-brand-accent hover:bg-blue-600 text-white px-5 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-brand-accent/20">
                <i data-lucide="plus" class="h-5 w-5"></i> 新增標的
            </button>
            
            <div class="glass-panel px-5 py-3 rounded-2xl flex flex-wrap items-center justify-between lg:justify-start gap-4 lg:gap-6 w-full lg:w-auto">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold flex items-center gap-1">
                        <i data-lucide="line-chart" class="h-3.5 w-3.5"></i> 加權指數
                    </p>
                    <p class="text-xl lg:text-2xl font-bold text-white" id="taiexValueDisplay">23,550.00</p>
                </div>
                <div class="h-10 w-px bg-gray-700 hidden sm:block"></div>
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">總資產市值</p>
                    <p class="text-xl lg:text-2xl font-bold text-brand-gold" id="totalAssetValue">---</p>
                </div>
                <div class="h-10 w-px bg-gray-700 hidden sm:block"></div>
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">總報酬率</p>
                    <p class="text-lg lg:text-xl font-bold flex items-center gap-1" id="totalAssetReturn">---</p>
                </div>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="xl:col-span-1 flex flex-col gap-6">
            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl overflow-hidden flex flex-col">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="briefcase" class="text-brand-accent h-5 w-5"></i> 核心庫存與損益
                </h2>
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-800/50">
                            <tr>
                                <th class="px-3 py-2">標的</th>
                                <th class="px-3 py-2">股數</th>
                                <th class="px-3 py-2">均價/現價</th>
                                <th class="px-3 py-2">損益</th>
                                <th class="px-3 py-2 text-right">佔比</th>
                                <th class="px-3 py-2 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryList" class="divide-y divide-gray-700/50"></tbody>
                    </table>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl flex-1">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="radar" class="text-[#ef4444] h-5 w-5"></i> 獵人警戒名單
                </h2>
                <div id="watchlistContainer" class="space-y-3"></div>
            </div>
        </div>

        <div class="xl:col-span-2 glass-panel rounded-2xl p-4 md:p-5 flex flex-col shadow-xl min-h-[600px]">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4 w-full">
                <div class="w-full lg:w-auto">
                    <label class="text-xs text-gray-400 uppercase font-semibold mb-1 block">分析標的</label>
                    <div class="relative w-full">
                        <select id="stockSelector" class="w-full appearance-none bg-gray-800 border border-gray-600 text-white py-2 pl-4 pr-10 rounded-lg focus:outline-none focus:border-brand-accent transition-colors font-medium cursor-pointer">
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-2.5 h-5 w-5 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>
                <div class="w-full lg:w-auto flex gap-1">
                    <button id="toggleChartTypeBtn" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-lg text-xs font-bold text-white border border-gray-600 shadow-sm flex items-center gap-1">
                        <i data-lucide="activity" class="h-3.5 w-3.5"></i> 切換視圖
                    </button>
                    <button id="toggleMABtn" class="bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-lg text-xs font-medium text-brand-ma10 border border-gray-600 flex items-center gap-1">
                        <i data-lucide="git-commit" class="h-3 w-3"></i> 均線
                    </button>
                </div>
            </div>
            <div id="tvChartContainer" class="flex-1 w-full relative min-h-[450px]"></div>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden p-6">
            <h3 class="text-xl font-bold text-white mb-4">設定標的</h3>
            <div class="space-y-4">
                <input type="text" id="modalId" placeholder="輸入代號 (如: 2330)" class="w-full bg-gray-800 p-3 rounded-lg text-white">
                <button onclick="fetchStockInfo()" class="w-full bg-blue-600 p-2 rounded-lg text-white font-bold">由 Google 即時搜尋價格</button>
            </div>
            <button onclick="closeAddModal()" class="mt-4 text-gray-400">取消</button>
        </div>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvO_F80lJe9u42UfrSKQC_bAs9w3aCmx8",
            authDomain: "stock-analysis-3a851.firebaseapp.com",
            projectId: "stock-analysis-3a851",
            storageBucket: "stock-analysis-3a851.firebasestorage.app",
            messagingSenderId: "23417647081",
            appId: "1:23417647081:web:89e9b0fc9fa11d35fda578"
        };
        
        async function fetchStockInfo() {
            const id = document.getElementById('modalId').value;
            showToast(`正在透過 Google 搜尋 ${id} 的最新行情...`, 'search');
            await new Promise(r => setTimeout(r, 1500));
            showToast(`已成功獲取 ${id} 的即時市場價格`);
            closeAddModal();
        }
        
        async function syncPricesWithAI() {
            showToast('啟動 Google 聯網引擎同步報價...', 'search');
            await new Promise(r => setTimeout(r, 1000));
            showToast('所有標的價格已同步至最新數據');
        }

        function showToast(msg, icon = "check-circle", color = "text-brand-accent") {
            const t = document.getElementById('toast');
            if (!t) return;
            t.className = "fixed bottom-5 right-5 bg-gray-850 border border-gray-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-[100] transition-all duration-300";
            t.innerHTML = `<i data-lucide="${icon}" class="${color} h-5 w-5"></i><span class="font-medium">${msg}</span>`;
            lucide.createIcons({ root: t });
            setTimeout(() => t.className += " translate-y-20 opacity-0", 2500);
        }

        window.onload = () => { 
            lucide.createIcons(); 
            setInterval(() => {
                document.getElementById('currentTimeDisplay').innerText = new Date().toLocaleTimeString();
            }, 1000);
        };
        
        function renderAll() {}
        function generateDailyReport() {}
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
    </script>
</body>
</html>
