<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位資產指揮中心 | 個人財富終端</title>
    
    <!-- 核心套件引入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 引入 Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        brand: {
                            gold: '#ffd700', accent: '#3b82f6', danger: '#10b981', 
                            success: '#ef4444', warning: '#f59e0b', 
                            fund: '#8b5cf6', bank: '#14b8a6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .glass-panel { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        .tv-lightweight-charts { border-radius: 0.5rem; overflow: hidden; }
        .up-color { color: #ef4444; } 
        .down-color { color: #10b981; } 
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 custom-scrollbar relative">
    
    <!-- 全局系統推播 -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-850 border border-brand-accent text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-[100] pointer-events-none">
        <i data-lucide="check-circle" id="toastIcon" class="text-brand-accent h-5 w-5"></i>
        <span id="toastMsg" class="font-medium text-sm">系統訊息</span>
    </div>

    <!-- 頂部指揮中心標頭 -->
    <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-8 gap-5">
        <div>
            <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                <i data-lucide="crosshair" class="text-brand-accent h-8 w-8"></i>
                全方位資產終端 <span class="text-xs bg-gray-600/50 text-gray-400 px-2 py-1 rounded-full ml-2" id="cloudStatusBadge">系統初始化中</span>
            </h1>
            <div class="text-gray-400 mt-2 flex flex-wrap items-center gap-3">
                <p class="flex items-center gap-2">
                    <i data-lucide="clock" class="h-4 w-4"></i> <span id="currentTimeDisplay">系統啟動中...</span>
                </p>
                <button onclick="syncPricesWithAI()" id="syncBtn" class="flex items-center gap-1.5 text-xs bg-gray-800 hover:bg-gray-700 text-brand-accent px-3 py-1.5 rounded-md transition-colors border border-gray-700 shadow-sm">
                    <i id="syncIcon" data-lucide="search" class="h-3.5 w-3.5"></i> Google 報價同步
                </button>
            </div>
        </div>

        <!-- 頂部四大資產總覽 -->
        <div class="glass-panel px-6 py-4 rounded-2xl flex flex-wrap items-center justify-between lg:justify-start gap-6 shadow-xl w-full xl:w-auto border-t-4 border-t-brand-accent">
            <div>
                <p class="text-xs text-gray-400 uppercase font-semibold">大盤指數</p>
                <p class="text-xl font-bold text-white" id="taiexValueDisplay">---</p>
            </div>
            <div class="h-8 w-px bg-gray-700 hidden sm:block"></div>
            <div>
                <p class="text-xs text-gray-400 uppercase font-semibold">股票總值 (含現金)</p>
                <p class="text-xl font-bold text-brand-accent" id="ov-stock-val">---</p>
            </div>
            <div class="h-8 w-px bg-gray-700 hidden sm:block"></div>
            <div>
                <p class="text-xs text-gray-400 uppercase font-semibold">銀行存款總額</p>
                <p class="text-xl font-bold text-brand-bank" id="ov-bank-val">---</p>
            </div>
            <div class="h-8 w-px bg-gray-700 hidden sm:block"></div>
            <div>
                <p class="text-xs text-gray-400 uppercase font-semibold">保險與基金</p>
                <p class="text-xl font-bold text-brand-fund" id="ov-fund-val">---</p>
            </div>
            <div class="h-8 w-px bg-gray-700 hidden sm:block"></div>
            <div>
                <p class="text-xs text-brand-gold uppercase font-semibold flex items-center gap-1"><i data-lucide="award" class="h-3 w-3"></i> 總淨資產 (Net Worth)</p>
                <p class="text-2xl font-bold text-brand-gold" id="globalTotalAsset">---</p>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- 區塊 1: 股票戰術中心                       -->
    <!-- ========================================== -->
    <div class="mb-4 mt-8 flex flex-wrap items-center justify-between border-b border-gray-800 pb-2 gap-3">
        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="trending-up" class="text-brand-accent h-5 w-5"></i> 股票戰術中心</h2>
        <div class="flex gap-2">
            <button onclick="openCashModal()" class="flex items-center gap-1 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-600 transition-colors">
                <i data-lucide="wallet" class="h-3.5 w-3.5 text-brand-accent"></i> 交割金: <span id="stockCashVal" class="font-mono text-white">$---</span>
            </button>
            <button onclick="openStockAddModal()" class="flex items-center gap-1 text-xs bg-brand-accent hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-lg transition-colors">
                <i data-lucide="plus" class="h-3.5 w-3.5"></i> 新增標的
            </button>
        </div>
    </div>
    
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-10">
        <!-- 左欄: 庫存與警戒 -->
        <div class="xl:col-span-1 flex flex-col gap-6">
            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl flex flex-col">
                <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center gap-2"><i data-lucide="briefcase" class="text-brand-accent h-4 w-4"></i> 核心庫存與損益</h3>
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-xs text-left whitespace-nowrap">
                        <thead class="text-gray-400 border-b border-gray-700">
                            <tr>
                                <th class="px-2 py-2">標的</th>
                                <th class="px-2 py-2">股數</th>
                                <th class="px-2 py-2">損益</th>
                                <th class="px-2 py-2 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryList" class="divide-y divide-gray-800/50"></tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-4 md:p-5 shadow-xl flex-1">
                <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center gap-2"><i data-lucide="radar" class="text-[#ef4444] h-4 w-4"></i> 獵人警戒名單</h3>
                <div id="watchlistContainer" class="space-y-2"></div>
            </div>
        </div>

        <!-- 右欄: 專業 K 線圖表 -->
        <div class="xl:col-span-2 glass-panel rounded-2xl p-4 md:p-5 flex flex-col shadow-xl min-h-[450px]">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 gap-4 w-full">
                <div class="w-full lg:w-1/3">
                    <select id="stockSelector" class="w-full bg-gray-800 border border-gray-600 text-white p-2 rounded-lg text-sm focus:outline-none focus:border-brand-accent cursor-pointer outline-none"></select>
                </div>
                <div class="w-full lg:w-auto overflow-x-auto pb-1 custom-scrollbar">
                    <div class="flex bg-gray-800 p-1 rounded-lg border border-gray-700 min-w-max gap-1">
                        <button id="toggleChartTypeBtn" class="px-3 py-1.5 text-xs font-bold rounded-md text-white bg-gray-700 hover:bg-gray-600 transition-colors flex items-center gap-1 border border-gray-600 shadow-sm mr-2">
                            <i data-lucide="activity" id="chartIconLine" class="h-3.5 w-3.5 hidden"></i>
                            <i data-lucide="bar-chart-2" id="chartIconCandle" class="h-3.5 w-3.5"></i>
                            <span id="chartToggleText">切換為 K線</span>
                        </button>
                        <div class="w-px h-6 bg-gray-600 self-center mr-1"></div>
                        <button class="tf-btn px-2.5 py-1 text-xs text-gray-400 hover:text-white rounded" data-tf="1D">1D</button>
                        <button class="tf-btn px-2.5 py-1 text-xs text-gray-400 hover:text-white rounded" data-tf="3D">3D</button>
                        <button class="tf-btn px-2.5 py-1 text-xs text-gray-400 hover:text-white rounded" data-tf="1W">1W</button>
                        <button class="tf-btn px-2.5 py-1 text-xs text-gray-400 hover:text-white rounded" data-tf="1M">1M</button>
                        <button class="tf-btn px-2.5 py-1 text-xs bg-brand-accent text-white rounded shadow" data-tf="6M">6M</button>
                        <button class="tf-btn px-2.5 py-1 text-xs text-gray-400 hover:text-white rounded" data-tf="1Y">1Y</button>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3 mb-2 px-1">
                <span class="text-xs text-gray-400">當前價位: <span class="text-base font-bold text-white font-mono ml-1" id="statPrice">---</span></span>
            </div>
            
            <div id="tvChartContainer" class="flex-1 w-full relative min-h-[350px]"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 區塊 2: 銀行與記帳中心                     -->
    <!-- ========================================== -->
    <div class="mb-4 mt-8 flex items-center justify-between border-b border-gray-800 pb-2">
        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="landmark" class="text-brand-bank h-5 w-5"></i> 銀行與記帳中心</h2>
        <button onclick="openBankModal()" class="flex items-center gap-1 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-brand-bank px-3 py-1.5 rounded-lg transition-colors">
            <i data-lucide="plus-circle" class="h-3.5 w-3.5"></i> 新增帳戶
        </button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-8 mb-10">
        <!-- 左欄: 銀行帳戶列表 -->
        <div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="bankListContainer"></div>
        </div>
        
        <!-- 右欄: 快速記帳台與紀錄 -->
        <div class="flex flex-col gap-4">
            <div class="bg-gradient-to-br from-gray-800 to-gray-850 p-5 rounded-2xl border border-gray-700 shadow-xl">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="pen-tool" class="text-brand-bank h-4 w-4"></i> 快速記帳 (連動帳戶餘額)</h3>
                <form id="txForm" onsubmit="submitTransaction(event)" class="space-y-3">
                    <div class="flex gap-2">
                        <select id="txType" class="bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white w-1/3 focus:border-brand-bank outline-none">
                            <option value="expense">支出 (-)</option>
                            <option value="income">收入 (+)</option>
                        </select>
                        <select id="txBank" class="bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white flex-1 focus:border-brand-bank outline-none"></select>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="txAmount" required min="1" placeholder="金額 (NT$)" class="w-1/3 bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white font-mono focus:border-brand-bank outline-none">
                        <input type="text" id="txNote" required placeholder="項目說明 (例: 晚餐、薪資)" class="flex-1 bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white focus:border-brand-bank outline-none">
                    </div>
                    <button type="submit" class="w-full bg-brand-bank hover:bg-teal-400 text-white font-bold py-2.5 rounded-lg transition-colors shadow-lg shadow-brand-bank/20">
                        登錄帳務
                    </button>
                </form>
            </div>

            <div class="glass-panel p-4 rounded-2xl flex-1">
                <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">近期帳務紀錄</h3>
                <div class="space-y-2 overflow-y-auto max-h-[250px] custom-scrollbar pr-2" id="txListContainer"></div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 區塊 3: 保險與基金部位                     -->
    <!-- ========================================== -->
    <div class="mb-4 mt-8 flex items-center justify-between border-b border-gray-800 pb-2">
        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="shield" class="text-brand-fund h-5 w-5"></i> 保險與基金部位</h2>
        <button onclick="openFundModal()" class="flex items-center gap-1 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-brand-fund px-3 py-1.5 rounded-lg transition-colors">
            <i data-lucide="plus-circle" class="h-3.5 w-3.5"></i> 新增部位
        </button>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-10" id="fundListContainer"></div>

    <!-- ========================================== -->
    <!-- 彈出視窗 (Modals)                          -->
    <!-- ========================================== -->
    
    <!-- 股票新增/編輯 Modal -->
    <div id="stockAddModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2" id="sModalTitle"><i data-lucide="crosshair" class="text-brand-accent w-5 h-5"></i> 設定股票目標</h3>
            <input type="hidden" id="sModalIndex" value="-1">
            <div class="space-y-3">
                <select id="sModalType" class="w-full bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none" onchange="toggleStockModalFields()">
                    <option value="inventory">核心庫存 (建立實單)</option>
                    <option value="watchlist">警戒名單 (觀測與哨兵)</option>
                </select>
                <div class="flex gap-2">
                    <input type="text" id="sModalId" placeholder="代號 (例: 2330)" class="flex-1 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none">
                    <button onclick="fetchStockInfo()" class="bg-brand-accent/20 text-brand-accent hover:bg-brand-accent/30 px-3 rounded-lg text-xs font-bold border border-brand-accent/30 flex items-center gap-1">
                        <i data-lucide="bot" class="w-3 h-3"></i> AI 抓價
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="sModalName" placeholder="標的名稱" class="flex-1 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none">
                    <input type="number" id="sModalPrice" placeholder="現價" step="0.01" class="w-1/3 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none font-mono">
                </div>
                
                <div id="sModalInvFields" class="flex gap-2">
                    <input type="number" id="sModalCost" placeholder="持有均價" step="0.01" class="w-1/2 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none font-mono">
                    <input type="number" id="sModalShares" placeholder="總股數" class="w-1/2 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none font-mono">
                </div>

                <div id="sModalWatchFields" class="space-y-3 hidden">
                    <div class="flex gap-2">
                        <input type="number" id="sModalAlert" placeholder="哨兵線(觀測設0)" step="0.01" class="w-1/2 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none font-mono">
                        <select id="sModalLabel" class="w-1/2 bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none">
                            <option value="danger">極度接近 (紅)</option>
                            <option value="warning">高度警戒 (橘)</option>
                            <option value="success">安全觀望 (綠)</option>
                            <option value="accent">風向指標 (藍)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="mt-5 flex justify-end gap-2">
                <button onclick="closeStockAddModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
                <button onclick="submitStockTarget()" class="px-5 py-2 bg-brand-accent hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg">鎖定目標</button>
            </div>
        </div>
    </div>

    <!-- 基金/銀行共用 Modal -->
    <div id="simpleAssetModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4" id="saModalTitle">新增資產</h3>
            <input type="hidden" id="saModalType">
            <input type="hidden" id="saModalIndex" value="-1">
            <div class="space-y-3">
                <input type="text" id="saModalName" placeholder="名稱 (如: 台新 Richart 或 南山儲蓄險)" class="w-full bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none">
                <input type="number" id="saModalAmount" placeholder="目前餘額/現值" class="w-full bg-gray-800 p-2.5 rounded-lg text-white border border-gray-600 outline-none font-mono text-lg font-bold">
            </div>
            <div class="mt-5 flex justify-end gap-2">
                <button onclick="closeSimpleAssetModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
                <button onclick="submitSimpleAsset()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg">儲存更新</button>
            </div>
        </div>
    </div>

    <!-- 股票現金編輯 Modal -->
    <div id="stockCashModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="wallet" class="h-5 w-5 text-brand-accent"></i> 調整股票交割金</h3>
            <input type="number" id="stockCashInput" step="1" min="0" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-3 text-white focus:border-brand-accent outline-none font-mono font-bold text-xl">
            <div class="mt-5 flex justify-end gap-2">
                <button onclick="closeCashModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
                <button onclick="submitCash()" class="px-5 py-2 bg-brand-accent hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg">確認同步</button>
            </div>
        </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-[#ef4444]/30 rounded-2xl p-6 text-center w-full max-w-sm">
            <h3 class="text-white font-bold mb-2">確定要捨棄此紀錄嗎？</h3>
            <p class="text-sm text-gray-400 mb-5">此動作無法復原。</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirmModal()" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors w-full">取消</button>
                <button onclick="executeConfirm()" class="px-5 py-2 bg-[#ef4444] hover:bg-red-600 text-white rounded-lg font-bold shadow-lg w-full transition-colors">確認刪除</button>
            </div>
        </div>
    </div>
